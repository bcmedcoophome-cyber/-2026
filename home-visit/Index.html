<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재택의료 방문상담</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #1f2933; --muted: #6b7680; --line: #dfe3e8;
    --brand: #1a73e8; --brand-ink: #fff; --brand-soft: #e8f0fe;
    --danger: #c5221f; --danger-soft: #fce8e6; --ok: #188038; --ok-soft: #e6f4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --ink: #e8eaed; --muted: #9aa0a6; --line: #343a40;
      --brand: #8ab4f8; --brand-ink: #10131a; --brand-soft: #1f2a3d;
      --danger: #f28b82; --danger-soft: #3b1f1d; --ok: #81c995; --ok-soft: #1b3122;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #timer { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  #timer.warn { color: var(--danger); font-weight: 700; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }
  .banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; display: none; }
  .banner.show { display: block; }
  .banner.info { background: var(--brand-soft); }
  .banner.danger { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner a { color: inherit; font-weight: 700; }
  .banner button { margin-left: 6px; }

  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  section.card > h2 { margin: 0; font-size: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  section.card > h2 .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
  section.card > h2 .count.done { color: var(--ok); }
  section.card > h2::after { content: "▾"; color: var(--muted); font-size: 14px; }
  section.card.closed > h2::after { content: "▸"; }
  section.card.closed .body { display: none; }
  section.card.crisis > h2 { color: var(--danger); }
  .body { padding: 0 16px 14px; }
  .field { margin-bottom: 14px; }
  .field > label, .field > .label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .req { color: var(--danger); }
  input[type=text], input[type=date], input[type=number], input[type=tel], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 9px 14px; font: inherit; font-size: 15px; min-height: 42px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .crisis .chip[aria-pressed=true] { background: var(--danger); border-color: var(--danger); }
  .phrases { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .phrase { font: inherit; font-size: 13px; border: 1px dashed var(--line); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; }

  .btn { font: inherit; font-weight: 700; border-radius: 12px; padding: 13px 16px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  footer .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  footer .inner .btn { flex: 1; }
  footer .btn.primary { flex: 1.6; }
  .saved-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .saved-item .who { flex: 1; min-width: 0; }
  .saved-item .who small { display: block; color: var(--muted); font-size: 12px; }
  #savedList { max-height: 60vh; overflow: auto; }
  #savedList:empty::before { content: "저장된 기록이 없습니다."; display: block; padding: 16px; color: var(--muted); }
  #draftState, #cState { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  /* 탭 */
  .tabs { position: sticky; top: 49px; z-index: 9; display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; font: inherit; font-weight: 700; padding: 12px 0; border: 0; background: transparent; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--brand); border-bottom-color: var(--brand); }
  .tabs button { font-size: 14px; padding: 12px 2px; white-space: nowrap; min-width: 0; }
  .tabs button { overflow: hidden; text-overflow: clip; }
  @media (max-width: 380px) { .tabs button { font-size: 13px; letter-spacing: -0.5px; } .tab-n { line-height: 16px; } }
  .tab-n { display: inline-block; min-width: 16px; margin-left: 2px; padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; }
  .tab-n:empty { display: none; }

  /* 환자카드 · 방문예정 */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar > input, .toolbar > .grow { flex: 1; min-width: 0; }
  input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: 14px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.muted { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .pcard { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; font: inherit; color: inherit; cursor: pointer; }
  .pcard .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pcard .nm { font-weight: 700; font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; }
  .pcard .sub { margin-top: 2px; }
  .idcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .idcard .nm { font-size: 22px; font-weight: 800; }
  .idcard .birth { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .pinfo { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 12px 0 0; }
  .pinfo dt { color: var(--muted); }
  .pinfo dd { margin: 0; }
  .idcard .row { margin-top: 12px; }
  .idcard .row .btn { padding: 12px 6px; font-size: 15px; white-space: nowrap; }
  .back { margin-bottom: 10px; }
  .sec-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }
  .timeline { margin-left: 6px; padding-left: 16px; border-left: 2px solid var(--line); }
  .tl-item { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .tl-item::before { content: ""; position: absolute; left: -25px; top: 14px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--brand); border: 2px solid var(--bg); }
  .tl-item.draft::before { background: var(--muted); }
  .tl-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tl-head .d { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl-head .sub { margin-left: auto; }
  .tl-body { margin-top: 6px; font-size: 14px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .tl-item:not(.open) .tl-body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tl-crisis { color: var(--danger); font-weight: 700; font-size: 14px; margin-top: 6px; }
  .tl-more { margin-top: 6px; font-size: 13px; }
  .tl-more a { color: var(--brand); font-weight: 700; }
  .todo { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .todo.late { border-color: var(--danger); }
  .todo .tick { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; color: transparent;
    font: inherit; font-weight: 800; cursor: pointer; padding: 0; }
  .todo.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
  .todo.done .nm { text-decoration: line-through; color: var(--muted); }
  .todo .main { flex: 1; min-width: 0; }
  .todo .nm { font-weight: 700; font-size: 16px; }
  .todo .note { font-size: 14px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .todo .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .due { font-size: 13px; font-weight: 700; color: var(--muted); }
  .due.late { color: var(--danger); }
  .due.today { color: var(--brand); }
  #tDoneBox summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 10px 2px; }
  [hidden] { display: none !important; }
  /* 동의서 */
  .clause { font-size: 14px; line-height: 1.55; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  .clause p { margin: 0 0 4px; padding-left: 1.1em; text-indent: -1.1em; }
  .clause b { font-weight: 700; }
  #cform section.card > h2, #tFormCard > h2 { cursor: default; }
  #cform section.card > h2::after, #tFormCard > h2::after { content: none; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 6px 0 0; }
  .sigwrap { border: 1px dashed var(--muted); border-radius: 12px; background: #fff; position: relative; touch-action: none; }
  .sigwrap canvas { display: block; width: 100%; height: 160px; border-radius: 12px; }
  .sigwrap .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa0a6; pointer-events: none; font-size: 15px; }
  .sigrow { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 15px; margin: 4px 0 10px; }
  .check input { width: 22px; height: 22px; }
  dialog { border: none; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .d-head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); }
  dialog pre { margin: 0; padding: 14px 16px; white-space: pre-wrap; word-break: keep-all; font: inherit; font-size: 14px;
    max-height: 58vh; overflow: auto; }
  dialog .d-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  dialog .d-foot .btn { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🏠 재택의료 방문상담</h1>
  <span id="timer" title="방문 경과시간">00:00</span>
</header>
<nav class="tabs" role="tablist">
  <button type="button" role="tab" data-tab="visit" aria-selected="true">📝 방문기록</button>
  <button type="button" role="tab" data-tab="consent" aria-selected="false">✍️ 동의서</button>
  <button type="button" role="tab" data-tab="cards" aria-selected="false">🗂 환자카드</button>
  <button type="button" role="tab" data-tab="todo" aria-selected="false">📅 방문예정<span class="tab-n" id="todoCount"></span></button>
</nav>

<main id="visitMain">
  <div id="demoBanner" class="banner info">미리보기 모드입니다. 구글 Apps Script로 배포하면 드라이브로 전송됩니다.</div>
  <div id="errBanner" class="banner danger"></div>
  <div id="queueBanner" class="banner info"><span id="queueText"></span><button class="btn small" id="retryBtn" type="button">다시 보내기</button></div>
  <div id="savedBanner" class="banner info"><span id="savedText"></span><button class="btn small" id="savedOpenBtn" type="button">목록</button></div>
  <div id="okBanner" class="banner ok"></div>
  <div id="crisisBanner" class="banner danger"></div>
  <form id="form" autocomplete="off" onsubmit="return false"></form>
</main>

<main id="consentMain" hidden>
  <div id="cErr" class="banner danger"></div>
  <div id="cOk" class="banner ok"></div>
  <form id="cform" autocomplete="off" onsubmit="return false"></form>
</main>

<main id="cardsMain" hidden>
  <div id="pErr" class="banner danger"></div>
  <div id="pListView">
    <div class="toolbar">
      <input type="search" id="pSearch" placeholder="이름 또는 생년월일로 찾기" autocomplete="off">
      <button class="btn small" type="button" id="pRefresh">새로고침</button>
    </div>
    <div id="pList"></div>
  </div>
  <div id="pDetail" hidden></div>
</main>

<main id="todoMain" hidden>
  <div id="tErr" class="banner danger"></div>
  <div id="tOk" class="banner ok"></div>
  <section class="card" id="tFormCard">
    <h2 id="tFormTitle">방문할 분 적기</h2>
    <div class="body">
      <div class="row">
        <div class="field"><label for="t-name">이름 <span class="req">*</span></label><input type="text" id="t-name" list="patientList" autocomplete="off"></div>
        <div class="field"><label for="t-birth">생년월일</label><input type="text" id="t-birth" inputmode="numeric" maxlength="10" placeholder="예: 19450312"></div>
      </div>
      <div class="row">
        <div class="field"><label for="t-due">방문 예정일</label><input type="date" id="t-due"></div>
        <div class="field"><label for="t-author">작성자</label><input type="text" id="t-author"></div>
      </div>
      <div class="field"><label for="t-note">내용</label>
        <textarea id="t-note" placeholder="왜 방문해야 하는지, 챙길 것 (예: 퇴원 후 상태 확인, 등급신청 서류 전달)"></textarea>
        <div class="phrases" id="tPhrases"></div>
      </div>
      <div class="row">
        <button class="btn" type="button" id="tCancel" hidden>취소</button>
        <button class="btn primary" type="button" id="tSave">목록에 추가</button>
      </div>
    </div>
  </section>
  <div class="toolbar">
    <b id="tHead" class="grow">방문할 분</b>
    <button class="btn small" type="button" id="tRefresh">새로고침</button>
  </div>
  <div id="tList"></div>
  <details id="tDoneBox" hidden><summary id="tDoneHead"></summary><div id="tDone"></div></details>
</main>

<footer id="consentFooter" hidden>
  <div class="inner">
    <button class="btn" type="button" id="cResetBtn">새 동의서</button>
    <button class="btn primary" type="button" id="cSendBtn">동의서 전송</button>
  </div>
  <div id="cState">서명까지 받은 뒤 [동의서 전송]을 누르면 PDF로 드라이브에 저장됩니다</div>
</footer>

<footer id="visitFooter">
  <div class="inner">
    <button class="btn" type="button" id="resetBtn">NEW</button>
    <button class="btn" type="button" id="saveBtn">저장</button>
    <button class="btn primary" type="button" id="sendBtn">전송</button>
  </div>
  <div id="draftState">저장: 휴대폰+시트에 임시저장 · 전송: 방문기록지 만들기</div>
</footer>

<dialog id="confirmDlg">
  <div class="d-head">전송 전 확인</div>
  <pre id="summary"></pre>
  <div class="d-foot">
    <button class="btn" type="button" id="cancelBtn">수정</button>
    <button class="btn" type="button" id="copyBtn">요약복사</button>
    <button class="btn primary" type="button" id="confirmBtn">전송</button>
  </div>
</dialog>

<dialog id="savedDlg">
  <div class="d-head">저장된 기록 (아직 전송 안 함)</div>
  <div id="savedList"></div>
  <div class="d-foot"><button class="btn" type="button" id="savedCloseBtn">닫기</button></div>
</dialog>

<datalist id="patientList"></datalist>

<script>
/* 오류가 나면 화면 맨 위에 빨간 글씨로 보여 줌 (원인 확인용) */
window.addEventListener('error', function (e) {
  try {
    var box = document.getElementById('jsErr');
    if (!box) { box = document.createElement('div'); box.id = 'jsErr';
      box.style.cssText = 'background:#fce8e6;color:#c5221f;font:14px/1.5 sans-serif;padding:10px 14px;white-space:pre-wrap;word-break:break-all';
      (document.body || document.documentElement).insertBefore(box, (document.body || document.documentElement).firstChild); }
    box.textContent += '⚠ 화면 오류: ' + (e.message || e) + (e.lineno ? ' (줄 ' + e.lineno + ':' + e.colno + ')' : '') + '\n';
  } catch (x) {}
});
</script>
<script>
/* =====================================================================
 *  체크리스트 항목 정의 — 센터 상황에 맞게 이 부분만 고치면 됩니다.
 *  type: text | date | single(하나 선택) | multi(여러 개) | memo(긴 글)
 *  carry: true → 같은 환자 재방문 시 지난 기록에서 자동으로 채움
 *  label은 시트의 열 이름이 되므로 서로 겹치지 않게 해주세요.
 * ===================================================================== */
const FORM = [
  { id: 'basic', title: '기본정보', open: true, fields: [
    { key: 'patient', label: '환자명', type: 'text', required: true, list: 'patientList', half: true },
    { key: 'birth', label: '생년월일', type: 'text', half: true, placeholder: '예: 19450312', numeric: true },
    { key: 'date', label: '방문일', type: 'date', required: true, half: true },
    { key: 'author', label: '작성자', type: 'text', required: true, half: true, remember: true },
    { key: 'visitType', label: '방문유형', type: 'single', options: ['첫방문', '정기방문', '수시방문', '임종돌봄', '통합돌봄'] },
    { key: 'ltc', label: '장기요양등급', type: 'single', carry: true, options: ['미신청', '신청중', '1등급', '2등급', '3등급', '4등급', '5등급', '인지지원', '등급외'] },
    { key: 'ltcAgency', label: '장기요양기관명', type: 'text', carry: true, placeholder: '이용 중인 기관 (예: ○○재가복지센터)' },
    { key: 'disability', label: '장애정도', type: 'single', carry: true, options: ['해당 없음', '중증', '경증'] },
    { key: 'disabilityType', label: '장애유형', type: 'text', carry: true, placeholder: '예: 지체장애, 뇌병변장애, 시각장애' }
  ]},
  { id: 'home', title: '주거환경', fields: [
    { key: 'housing', label: '주거형태', type: 'single', carry: true, options: ['자가', '전세·월세', '공공임대', '고시원·쪽방', '기타'] },
    { key: 'homeRisk', label: '환경 위험요인', type: 'multi', carry: true, options: ['계단·엘리베이터 없음', '문턱·단차', '욕실 미끄럼', '조명 어두움', '냉난방 불량', '위생 불량', '화재 위험', '해당 없음'] }
  ]},
  { id: 'family', title: '가구·돌봄', fields: [

/* ======================== 이하 동작 코드 ======================== */
const SCREEN_VERSION = '2026-10-28'; // 화면 버전 (GitHub에서 자동으로 불러옴)
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const KEY_SAVED = 'hv_saved', KEY_DRAFT = 'hv_draft', KEY_QUEUE = 'hv_queue', KEY_AUTHOR = 'hv_author', KEY_START = 'hv_start';
const ALL_FIELDS = FORM.flatMap(s => s.fields.map(f => Object.assign({ section: s }, f)));
const $ = id => document.getElementById(id);
let state = {};
let patients = [];

function today() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function uid() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- 화면 그리기 ---------- */
function render() {
  const form = $('form');
  form.innerHTML = FORM.map(sec => `
    <section class="card${sec.open ? '' : ' closed'}${sec.crisis ? ' crisis' : ''}" data-sec="${sec.id}">
      <h2>${esc(sec.title)}<span class="count" id="cnt-${sec.id}"></span></h2>
      <div class="body">${renderFields(sec.fields)}</div>
    </section>`).join('');

  form.querySelectorAll('section.card > h2').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('closed')));
  form.querySelectorAll('.chip').forEach(b => b.addEventListener('click', onChip));
  form.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', onInput));
  form.querySelectorAll('.phrase').forEach(b => b.addEventListener('click', onPhrase));
  $('f-patient').addEventListener('change', onPatientPicked);
}

function renderFields(fields) {
  let html = '', halves = [];
  const flush = () => { if (halves.length) { html += `<div class="row">${halves.join('')}</div>`; halves = []; } };
  fields.forEach(f => {
    const h = renderField(f);
    if (f.half) { halves.push(h); if (halves.length === 2) flush(); } else { flush(); html += h; }
  });
  flush();
  return html;
}

function renderField(f) {
  const req = f.required ? ' <span class="req">*</span>' : '';
  const id = 'f-' + f.key;
  if (f.type === 'single' || f.type === 'multi') {
    return `<div class="field"><span class="label">${esc(f.label)}${req}</span><div class="chips" role="group">` +
      f.options.map(o => `<button type="button" class="chip" aria-pressed="false" data-key="${f.key}" data-val="${esc(o)}">${esc(o)}</button>`).join('') +
      `</div></div>`;
  }
  if (f.type === 'memo') {
    return `<div class="field"><label for="${id}">${esc(f.label)}${req}</label>
      <textarea id="${id}" data-key="${f.key}" placeholder="키보드의 🎤 음성입력을 쓰면 빠릅니다"></textarea>
      ${f.phrases ? `<div class="phrases">${f.phrases.map(p => `<button type="button" class="phrase" data-key="${f.key}" data-val="${esc(p)}">+ ${esc(p)}</button>`).join('')}</div>` : ''}
    </div>`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${req}</label>
    <input id="${id}" type="${f.type}" data-key="${f.key}"${f.list ? ` list="${f.list}"` : ''}${f.numeric ? ' inputmode="numeric" maxlength="10"' : ''}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''}></div>`;
}

/* ---------- 상태 ↔ 화면 ---------- */
function paint() {
  ALL_FIELDS.forEach(f => {
    const v = state[f.key];
    if (f.type === 'single' || f.type === 'multi') {
      const sel = f.type === 'multi' ? (v || []) : (v ? [v] : []);
      document.querySelectorAll(`.chip[data-key="${f.key}"]`).forEach(b => b.setAttribute('aria-pressed', sel.includes(b.dataset.val)));
    } else {
      const el = $('f-' + f.key);
      if (el && el.value !== (v || '')) el.value = v || '';
    }
  });
  updateCounts();
}

function updateCounts() {
  FORM.forEach(sec => {
    const filled = sec.fields.filter(f => hasValue(state[f.key])).length;
    const el = $('cnt-' + sec.id);
    el.textContent = filled ? `${filled}/${sec.fields.length}` : '';
    el.classList.toggle('done', filled === sec.fields.length);
  });
  const crisis = (state.crisis || []).filter(c => c !== '해당 없음');
  const cb = $('crisisBanner');
  cb.textContent = crisis.length ? `⚠ 위기신호 체크됨: ${crisis.join(', ')} — 팀 즉시 공유 필요` : '';
  cb.classList.toggle('show', crisis.length > 0);
}

function hasValue(v) { return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }

function onChip(e) {
  const b = e.currentTarget, key = b.dataset.key, val = b.dataset.val;
  const f = ALL_FIELDS.find(x => x.key === key);
  if (f.type === 'single') {
    state[key] = state[key] === val ? '' : val;
  } else {
    let arr = (state[key] || []).slice();
    const exclusive = /^(해당 없음|없음)$/;
    if (arr.includes(val)) arr = arr.filter(x => x !== val);
    else if (exclusive.test(val)) arr = [val];
    else arr = arr.filter(x => !exclusive.test(x)).concat(val);
    state[key] = arr;
  }
  paint(); saveDraft();
}

function onInput(e) {
  const key = e.target.dataset.key;
  if (key === 'birth') e.target.value = formatBirth(e.target.value);
  state[key] = e.target.value;
  if (key === 'author') LS.set(KEY_AUTHOR, e.target.value);
  updateCounts(); saveDraft();
}

function onPhrase(e) {
  const { key, val } = e.currentTarget.dataset;
  const cur = (state[key] || '').trim();
  state[key] = cur ? cur + ' ' + val : val;
  paint(); saveDraft();
}

/* 19450312 → 1945-03-12 */
function formatBirth(v) {
  const d = v.replace(/\D/g, '').slice(0, 8);
  return [d.slice(0, 4), d.slice(4, 6), d.slice(6, 8)].filter(Boolean).join('-');
}

/* ---------- 재방문 자동 채우기 ---------- */
function onPatientPicked() {
  const name = (state.patient || '').trim();
  const p = patients.filter(x => x.name === name);
  if (!p.length) return;
  const match = p.filter(x => x.birth && x.birth === state.birth).pop() || p[p.length - 1];
  const last = match.last;
  const carry = ALL_FIELDS.filter(f => f.carry && !hasValue(state[f.key]) && last[f.label]);
  if (!state.birth && match.birth) state.birth = match.birth;
  if (!state.visitType) state.visitType = '정기방문';
  carry.forEach(f => {
    state[f.key] = f.type === 'multi' ? last[f.label].split(', ').filter(o => f.options.includes(o)) : last[f.label];
  });
  paint(); saveDraft();
  const when = last['방문일'] ? `${last['방문일']} 방문 기록` : '지난 기록';
  flash('okBanner', `${esc(name)}님 ${esc(when)}에서 ${carry.length}개 항목을 불러왔습니다. 바뀐 부분만 수정하세요.`);
}

/* ---------- 임시저장 / 타이머 ---------- */
let draftTimer;
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    LS.set(KEY_DRAFT, state);
    if (!LS.get(KEY_START)) LS.set(KEY_START, Date.now());
    $('draftState').textContent = '임시저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }, 300);
}
function tick() {
  const start = LS.get(KEY_START);
  const sec = start ? Math.floor((Date.now() - start) / 1000) : 0;
  const t = $('timer');
  t.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  t.classList.toggle('warn', sec >= 25 * 60);
}

function freshState() {
  return { date: today(), author: LS.get(KEY_AUTHOR, '') };
}

/* ---------- 기록 만들기 ---------- */
function fmt(f, v) { return Array.isArray(v) ? v.join(', ') : (v || ''); }

function buildRecord() {
  return {
    id: state._id || (state._id = uid()),
    author: state.author || '',
    meta: { patient: (state.patient || '').trim(), birth: state.birth || '', date: state.date, visitType: state.visitType || '' },
    crisis: (state.crisis || []).filter(c => c !== '해당 없음'),
    sections: FORM.map(sec => ({
      title: sec.title,
      items: sec.fields.map(f => ({ label: f.label, value: fmt(f, state[f.key]) }))
    }))
  };
}

function summaryText(rec) {
  const lines = [`[재택의료 사회복지 상담] ${rec.meta.date} ${rec.meta.patient}`];
  if (rec.crisis.length) lines.push(`⚠ 위기신호: ${rec.crisis.join(', ')}`);
  rec.sections.forEach(sec => {
    const items = sec.items.filter(i => i.value && i.label !== '환자명' && i.label !== '방문일');
    if (!items.length) return;
    lines.push('', `■ ${sec.title}`);
    items.forEach(i => lines.push(`- ${i.label}: ${i.value}`));
  });
  return lines.join('\n');
}

function validate() {
  const missing = ALL_FIELDS.filter(f => f.required && !hasValue(state[f.key])).map(f => f.label);
  if (missing.length) {
    showError(`${missing.join(', ')}을(를) 입력해 주세요.`);
    document.querySelector('[data-sec="basic"]').classList.remove('closed');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return false;
  }
  return true;
}

/* ---------- 전송 / 미전송 대기열 ---------- */
function callServer(fn, arg) {
  return new Promise((resolve, reject) => {
    if (!IS_GAS) {
      setTimeout(() => resolve(demoServer(fn, arg)), 300);
      return;
    }
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
  });
}

async function send(rec) {
  const res = await callServer('saveVisit', rec);
  return res;
}

async function onConfirm() {
  const rec = buildRecord();
  $('confirmDlg').close();
  removeSaved(rec.id);
  const btn = $('sendBtn');
  btn.disabled = true; btn.textContent = '전송 중…';
  try {
    const res = await send(rec);
    afterSent(rec, res);
  } catch (err) {
    enqueue(rec);
    showError('전송하지 못했습니다(' + (err && err.message ? err.message : '네트워크') + '). 기기에 보관했으니 신호가 잡히면 "다시 보내기"를 눌러 주세요.');
    resetForm(true);
  } finally {
    btn.disabled = false; btn.textContent = '전송';
  }
}

function afterSent(rec, res) {
  const link = res && res.docUrl ? ` <a href="${esc(res.docUrl)}" target="_blank" rel="noopener">방문기록지 열기</a>` : '';
  flash('okBanner', `✅ ${esc(rec.meta.patient)}님 방문기록지를 드라이브 폴더에 저장했습니다.${res && res.demo ? ' (미리보기 — 실제 전송 안 됨)' : ''}${link}`, 15000);
  addPatient(rec);
  resetForm(true);
  cardsAt = 0; // 다음에 환자카드를 열 때 새로 불러옴
  offerTodoDone(rec);
}

function enqueue(rec) {
  const q = LS.get(KEY_QUEUE, []);
  if (!q.find(x => x.id === rec.id)) q.push(rec);
  LS.set(KEY_QUEUE, q);
  showQueue();
}

function showQueue() {
  const q = LS.get(KEY_QUEUE, []);
  $('queueText').textContent = `📦 미전송 기록 ${q.length}건 (${q.map(r => r.meta.patient).join(', ')})`;
  $('queueBanner').classList.toggle('show', q.length > 0);
}

async function flushQueue() {
  const q = LS.get(KEY_QUEUE, []);
  if (!q.length) return;
  $('retryBtn').disabled = true;
  const left = [];
  let sent = 0;
  for (const rec of q) {
    try { await send(rec); sent++; addPatient(rec); } catch (e) { left.push(rec); }
  }
  LS.set(KEY_QUEUE, left);
  $('retryBtn').disabled = false;
  showQueue();
  if (sent) flash('okBanner', `✅ 미전송 기록 ${sent}건을 드라이브에 저장했습니다.`);
  if (left.length) showError(`${left.length}건은 아직 전송되지 않았습니다. 잠시 후 다시 시도해 주세요.`);
}

function addPatient(rec) {
  const last = {};
  rec.sections.forEach(s => s.items.forEach(i => { if (i.value) last[i.label] = i.value; }));
  patients.push({ name: rec.meta.patient, birth: last['생년월일'] || '', last });
  fillPatientList();
}

function fillPatientList() {
  const seen = {};
  const opts = patients.slice().reverse().filter(p => !seen[p.name + p.birth] && (seen[p.name + p.birth] = 1));
  $('patientList').innerHTML = opts.map(p => `<option value="${esc(p.name)}"${p.birth ? ` label="${esc(p.birth)}"` : ''}>`).join('');
}

/* ---------- 저장(휴대폰에 보관) ---------- */
function saveCurrent(silent) {
  if (!hasValue(state.patient)) {
    if (!silent) showError('환자명을 입력해야 저장할 수 있습니다.');
    return false;
  }
  if (!state._id) state._id = uid();
  const list = LS.get(KEY_SAVED, []).filter(x => x.id !== state._id);
  list.push({ id: state._id, savedAt: Date.now(), state: JSON.parse(JSON.stringify(state)) });
  LS.set(KEY_SAVED, list);
  showSaved();
  if (!silent) {
    const who = esc(state.patient);
    if (!IS_GAS) {
      flash('okBanner', `💾 ${who}님 기록을 이 휴대폰에 저장했습니다.`);
    } else {
      flash('okBanner', `💾 ${who}님 기록을 휴대폰에 저장했습니다. 스프레드시트에 저장하는 중…`, 20000);
      callServer('saveDraft', buildRecord())
        .then(() => flash('okBanner', `💾 ${who}님 기록을 휴대폰과 스프레드시트에 저장했습니다(임시저장). 완료되면 [전송]을 눌러 방문기록지를 만드세요.`))
        .catch(err => showError(`휴대폰에는 저장했지만 스프레드시트 저장은 실패했습니다(${err && err.message ? err.message : '네트워크'}). 신호가 잡히면 [저장]을 다시 눌러 주세요.`));
    }
  }
  return true;
}

function removeSaved(id) {
  LS.set(KEY_SAVED, LS.get(KEY_SAVED, []).filter(x => x.id !== id));
  showSaved();
}

function showSaved() {
  const list = LS.get(KEY_SAVED, []);
  $('savedText').textContent = `💾 저장만 하고 전송 안 한 기록 ${list.length}건`;
  $('savedBanner').classList.toggle('show', list.length > 0);
  $('savedList').innerHTML = list.slice().reverse().map(x => {
    const t = new Date(x.savedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `<div class="saved-item"><div class="who"><b>${esc(x.state.patient)}</b> ${esc(x.state.visitType || '')}
      <small>방문일 ${esc(x.state.date || '')} · 저장 ${esc(t)}</small></div>
      <button class="btn small" type="button" data-load="${esc(x.id)}">불러오기</button>
      <button class="btn small" type="button" data-del="${esc(x.id)}">삭제</button></div>`;
  }).join('');
}

function onSavedClick(e) {
  const load = e.target.dataset.load, del = e.target.dataset.del;
  if (del && confirm('이 기록을 삭제할까요? 되돌릴 수 없습니다.')) removeSaved(del);
  if (load) {
    const item = LS.get(KEY_SAVED, []).find(x => x.id === load);
    if (!item) return;
    if (state._id !== load) saveCurrent(true);
    state = item.state;
    LS.set(KEY_DRAFT, state);
    paint();
    $('savedDlg').close();
    window.scrollTo({ top: 0 });
    flash('okBanner', `${esc(state.patient)}님 기록을 불러왔습니다. 이어서 작성하거나 [전송]하세요.`);
  }
}

function onNew() {
  if (hasValue(state.patient)) {
    saveCurrent(true);
    resetForm(true);

function resetForm(silent) {
  if (!silent && !confirm('입력 중인 내용을 지우고 새 방문을 시작할까요?')) return;
  state = freshState();
  LS.del(KEY_DRAFT); LS.del(KEY_START);
  document.querySelectorAll('#form section.card').forEach(s => {
    const sec = FORM.find(x => x.id === s.dataset.sec);
    if (sec) s.classList.toggle('closed', !sec.open);
  });
  paint(); tick();
  $('draftState').textContent = '저장: 휴대폰+시트에 임시저장 · 전송: 방문기록지 만들기' + ($('draftState').dataset.version ? ' · ' + $('draftState').dataset.version : '');
  window.scrollTo({ top: 0 });
}

function showError(msg) {
  const b = $('errBanner'); b.textContent = msg; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 12000);
}
function flash(id, html, ms) {
  const b = $(id); b.innerHTML = html; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), ms || 6000);
}

async function copySummary() {
  const text = summaryText(buildRecord());
  try { await navigator.clipboard.writeText(text); flash('okBanner', '요약을 복사했습니다. 전자의무기록(EMR)이나 메신저에 붙여넣으세요.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash('okBanner', '요약을 복사했습니다.'); } catch (e2) { showError('복사하지 못했습니다.'); }
    ta.remove();
  }
}

/* 손가락 서명 패드 */
function makePad(key) {
  const cv = $('sig-' + key), ph = $('ph-' + key);
  const ctx = cv.getContext('2d');
  let drawing = false, last = null;
  function fit() {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const keep = cstate['sig_' + key];
    cv.width = Math.round(r.width * 2); cv.height = Math.round(r.height * 2);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    if (keep) load(keep);
  }
  function load(url) {
    const img = new Image();
    img.onload = () => { const r = cv.getBoundingClientRect(); ctx.drawImage(img, 0, 0, r.width, r.height); ph.hidden = true; };
    img.src = url;
  }
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); ph.hidden = true; ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  const end = () => { if (!drawing) return; drawing = false; cstate['sig_' + key] = cv.toDataURL('image/png'); cSave(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  return {
    fit,
    clear() { const r = cv.getBoundingClientRect(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); ph.hidden = false; }
  };
}

function cPaint() {
  document.querySelectorAll('#cform input[data-ckey]').forEach(el => {
    const v = cstate[el.dataset.ckey];
    if (el.type === 'checkbox') el.checked = el.dataset.ckey === 'adminSame' ? v !== false : !!v;
    else if (el.value !== (v || '')) el.value = v || '';
  });
  document.querySelectorAll('#cform .chip[data-ckey]').forEach(b => b.setAttribute('aria-pressed', cstate[b.dataset.ckey] === b.dataset.val));
  $('proxyBox').hidden = !cstate.proxy;
  $('pRelEtcBox').hidden = cstate.pRel !== '기타';
  if ($('adminSigBox')) $('adminSigBox').hidden = cstate.adminSame !== false;
  document.querySelectorAll('.sigdate').forEach(el => { el.textContent = (cstate.date || today()).replace(/-/g, '. ') + '.'; });
  Object.keys(pads).forEach(k => { if (!cstate['sig_' + k]) pads[k].clear(); });
  requestAnimationFrame(() => Object.values(pads).forEach(p => p.fit()));
}
function onCChip(e) {

function cErr(msg) { const b = $('cErr'); b.textContent = msg; b.classList.add('show'); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- 원본 서식(공단용 3쪽) 위에 내용·서명을 찍어서 이미지로 만듦 ----------
 * 좌표 단위: pt (A4 595×842, 왼쪽 위 기준). 서식 이미지는 2배(1191×1684) 해상도. */
const FORM_IMG_BASE = 'https://bcmedcoophome-cyber.github.io/-2026/visit/forms/';
const NHIS_MAP = {
  pages: ['nhis-1.jpg', 'nhis-2.jpg', 'nhis-3.jpg'],
  text: {
    name: [1, 196, 194, 105], ltcNo: [1, 446, 194, 90], birth: [1, 196, 218, 105], phone: [1, 432, 218, 103],
    addr: [1, 256, 237, 280], addr2: [1, 196, 274, 340],
    pName: [2, 196, 571, 105], pPhone: [2, 382, 571, 150], pRelEtc: [2, 246, 617, 95]
  },
  check: { // [page, x, y] 동의함 / 동의안함 칸
    c1: [[1, 503.5, 567.5], [1, 503.5, 620]], c2: [[1, 503.5, 680], [1, 503.5, 732.5]],
    c3: [[2, 503.5, 113.5], [2, 503.5, 163]], c4: [[2, 503.5, 266.5], [2, 503.5, 315.5]],
    p1: [[2, 503.5, 676], [2, 503.5, 728.5]], p2: [[3, 503.5, 107], [3, 503.5, 159]]
  },
  relation: { '배우자': [2, 195.5, 581.5], '자녀(며느리, 사위 포함)': [2, 264, 581.5], '부모': [2, 415.5, 581.5], '형제자매': [2, 467, 581.5],
    '손자녀(손부, 손서 포함)': [2, 195.5, 595.5], '조부모(외조부모 포함)': [2, 339, 595.5], '기타': [2, 195.5, 609] },
  date: { self: [2, 398], proxy: [3, 243] },            // [page, 글자 아랫선 y]
  sign: { // [page, 이름 x, 이름 y, 서명칸 x, y, w, h]
    self: [2, 302, 423, 348, 398, 100, 38], proxy: [3, 302, 276, 348, 252, 100, 38], admin: [3, 376, 730, 412, 705, 43, 32]
  }
};
const FORM_FONT = '"Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
function loadImg(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => ok(im); im.onerror = () => bad(new Error('서식 이미지를 불러오지 못했습니다')); im.src = src; });
}
async function renderNhisPages(c) {
  const M = NHIS_MAP, S = 2;
  const bgs = await Promise.all(M.pages.map(f => loadImg(FORM_IMG_BASE + f)));
  const canv = bgs.map(bg => { const cv = document.createElement('canvas'); cv.width = 1191; cv.height = 1684; const x = cv.getContext('2d'); x.drawImage(bg, 0, 0, 1191, 1684); return cv; });
  const ctx = pg => canv[pg - 1].getContext('2d');
  function text(pg, x, y, str, maxW, size, align) {
    if (!str) return;
    const g = ctx(pg); let sz = size || 11;
    g.fillStyle = '#111'; g.textBaseline = 'alphabetic'; g.textAlign = align || 'left';
    do { g.font = `600 ${sz * S}px ${FORM_FONT}`; sz -= 0.5; } while (maxW && g.measureText(str).width > maxW * S && sz > 6);
    g.fillText(str, x * S, y * S);
  }
  function tick(pg, x, y) { // 체크 표시 ✔
    const g = ctx(pg); g.strokeStyle = '#111'; g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo((x + 1.5) * S, (y + 5) * S); g.lineTo((x + 4) * S, (y + 8.5) * S); g.lineTo((x + 10) * S, (y - 1) * S); g.stroke();
  }
  async function sign(key, name, url) {
    const [pg, nx, ny, sx, sy, sw, sh] = M.sign[key];
    text(pg, nx, ny, name, key === 'admin' ? 34 : 44, 12);
    if (!url) return;
    const im = await loadImg(url);
    const r = Math.min(sw / im.width, sh / im.height) * S;
    const g = ctx(pg); g.globalCompositeOperation = 'multiply';
    g.drawImage(im, sx * S, sy * S, im.width * r, im.height * r);
    g.globalCompositeOperation = 'source-over';
  }
  function date(key, d) {
    const [pg, y] = M.date[key]; const [yy, mm, dd] = String(d).split('-');
    text(pg, 432, y, yy, 0, 12, 'right'); text(pg, 474, y, String(+mm), 0, 12, 'right'); text(pg, 518, y, String(+dd), 0, 12, 'right');
  }
  const p = c.person, T = M.text;
  const field = (k, v, size) => { const [pg, x, y, w] = T[k]; text(pg, x, y, v, w, size); };
  field('name', p.name); field('ltcNo', String(p.ltcNo || '').replace(/^\s*[Ll]\s*/, ''));
  field('birth', p.birth); field('phone', p.phone);
  field('addr', p.addr, 9.5); field('addr2', p.addr2, 9.5);
  c.self.forEach((it, i) => { const k = 'c' + (i + 1); const box = M.check[k][it.answer === '동의함' ? 0 : 1]; tick(...box); });
  date('self', c.date);
  await sign('self', p.name, c.selfSig);
  if (c.proxy) {
    const px = c.proxy;
    field('pName', px.name); field('pPhone', px.phone);
    const rel = cstate.pRel; if (M.relation[rel]) tick(...M.relation[rel]);
    if (rel === '기타') field('pRelEtc', cstate.pRelEtc);
    px.items.forEach((it, i) => { const box = M.check['p' + (i + 1)][it.answer === '동의함' ? 0 : 1]; tick(...box); });
    date('proxy', c.date);
    await sign('proxy', px.name, px.sig);
    if (px.admin === '동의함') await sign('admin', px.name, px.adminSig);
  }
  return canv.map(cv => cv.toDataURL('image/jpeg', 0.85));
}

async function cSend() {

    const keep = { name: cstate.name, birth: cstate.birth, ltcNo: cstate.ltcNo, phone: cstate.phone, addr: cstate.addr, addr2: cstate.addr2,
      proxy: cstate.proxy, pName: cstate.pName, pPhone: cstate.pPhone, pRel: cstate.pRel, pRelEtc: cstate.pRelEtc };

      $('cOk').classList.remove('show'); renderConsent(); cPaint(); cSave();

    window.scrollTo({ top: 0 });
  } catch (err) {
    cErr('동의서를 전송하지 못했습니다(' + (err && err.message ? err.message : '네트워크') + '). 작성한 내용과 서명은 휴대폰에 남아 있으니 잠시 후 다시 [동의서 전송]을 눌러 주세요.');
  } finally {

  }
}

let cards = null, cardsAt = 0, cardsLoading = false, cardKey = '';
let todos = [], todosAt = 0, todosLoaded = false, tEditId = '';

/* 미리보기(구글 배포 전)에서 쓰는 가짜 서버 */
function demoServer(fn, arg) {
  if (fn === 'getInitData') return { patients: [] };
  if (fn === 'getPatientCards') return { cards: [] };
  if (fn === 'getTodos') return { todos: LS.get(KEY_DEMO_TODO, []) };
  if (fn === 'saveTodo') {
    const list = LS.get(KEY_DEMO_TODO, []);
    const prev = list.find(x => x.id === arg.id) || {};
    const t = Object.assign({}, arg, { created: prev.created || nowText(), doneAt: arg.done ? (prev.doneAt || nowText()) : '' });
    LS.set(KEY_DEMO_TODO, list.filter(x => x.id !== arg.id).concat(t));
    return { ok: true, todo: t };
  }
  if (fn === 'deleteTodo') { LS.set(KEY_DEMO_TODO, LS.get(KEY_DEMO_TODO, []).filter(x => x.id !== arg)); return { ok: true }; }
  return { ok: true, docUrl: '', demo: true };
}
function nowText() { return today() + ' ' + new Date().toTimeString().slice(0, 8); }
function errText(err) { return err && err.message ? err.message : '네트워크'; }

/* 19450312 → 만 나이 */
function ageOf(birth) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(birth || '');
  if (!m) return '';
  const t = today();
  let a = +t.slice(0, 4) - +m[1];
  if (t.slice(5) < m[2] + '-' + m[3]) a--;
  return a >= 0 && a < 130 ? a : '';
}
function birthText(birth) {
  if (!birth) return '생년월일 없음';
  const a = ageOf(birth);
  return birth + (a !== '' ? ` (만 ${a}세)` : '');
}
function crisisOf(v) {
  return (v.crisis || '').split(', ').filter(x => x && x !== '해당 없음').join(', ');
}
function sameName(a, b) { return String(a || '').trim() === String(b || '').trim(); }
function openTodosFor(name, birth) {
  return todos.filter(t => !t.done && sameName(t.name, name) && (!t.birth || !birth || t.birth === birth));
}
/* 지금 보이는 탭의 빨간 안내줄에 표시 */
function pageError(msg) {
  const id = !$('cardsMain').hidden ? 'pErr' : !$('todoMain').hidden ? 'tErr' : 'errBanner';
  const b = $(id); b.textContent = msg; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 12000);
}

/* ---------- 환자카드 ---------- */
function openCards(fresh) {
  if (fresh || !cards || Date.now() - cardsAt > STALE_MS) loadCards();
  renderCards();
}
function loadCards() {
  if (cardsLoading) return;
  cardsLoading = true;
  renderCards();
  callServer('getPatientCards')
    .then(d => { cards = d.cards || []; cardsAt = Date.now(); })
    .catch(err => pageError('환자카드를 불러오지 못했습니다(' + errText(err) + '). [새로고침]을 눌러 주세요.'))
    .then(() => { cardsLoading = false; renderCards(); });
}
function renderCards() {
  const c = cardKey && (cards || []).find(x => x.key === cardKey);
  if (cardKey && cards && !c) cardKey = '';
  $('pListView').hidden = !!c;
  $('pDetail').hidden = !c;
  if (c) renderCardDetail(c); else renderCardList();
}
function renderCardList() {
  const q = $('pSearch').value.trim().replace(/-/g, '');
  const list = (cards || []).filter(c => !q || c.name.indexOf(q) >= 0 || (c.birth || '').replace(/-/g, '').indexOf(q) >= 0);
  let html;
  if (!cards) html = `<div class="empty">${cardsLoading ? '불러오는 중…' : '환자카드를 불러오지 못했습니다.'}</div>`;
  else if (!list.length) html = `<div class="empty">${q ? '찾는 분이 없습니다.' : IS_GAS
    ? '아직 방문기록이 없습니다.<br>[방문기록] 탭에서 저장·전송하면 여기에 환자카드가 생깁니다.'
    : '미리보기 모드에서는 환자카드가 비어 있습니다.'}</div>`;
  else html = list.map(c => {
    const last = c.visits[0] || {};
    const crisis = crisisOf(last);
    const planned = openTodosFor(c.name, c.birth).length;
    return `<button type="button" class="pcard" data-act="card" data-key="${esc(c.key)}">
      <div class="top"><span class="nm">${esc(c.name)}</span><span class="sub">${esc(birthText(c.birth))}</span>
        ${crisis ? '<span class="badge danger">⚠ 위기신호</span>' : ''}${planned ? '<span class="badge">📅 방문예정</span>' : ''}</div>
      <div class="sub">방문 ${c.visits.length}회 · 최근 ${esc(last.date || '-')}${last.type ? ' ' + esc(last.type) : ''}${last.author ? ' · ' + esc(last.author) : ''}</div>
    </button>`;
  }).join('');
  if (cards && cardsLoading) html = '<div class="sub" style="margin-bottom:8px">새로 불러오는 중…</div>' + html;
  $('pList').innerHTML = html;
}
function renderCardDetail(c) {
  const info = CARD_INFO.filter(k => c.info && c.info[k]);
  const planned = openTodosFor(c.name, c.birth);
  $('pDetail').innerHTML = `
    <button type="button" class="btn small back" data-act="back">← 환자 목록</button>
    <div class="idcard">
      <div class="nm">${esc(c.name)}</div>
      <div class="birth">${esc(birthText(c.birth))}</div>
      ${info.length ? `<dl class="pinfo">${info.map(k => `<dt>${esc(k)}</dt><dd>${esc(c.info[k])}</dd>`).join('')}</dl>` : ''}
      <div class="row">
        <button type="button" class="btn primary" data-act="write">📝 방문기록 쓰기</button>
        <button type="button" class="btn" data-act="plan">📅 방문예정 추가</button>
      </div>
    </div>
    ${planned.length ? `<div class="sec-title">방문예정 ${planned.length}건</div>${planned.map(todoHtml).join('')}` : ''}
    <div class="sec-title">방문 기록 ${c.visits.length}건 · 최근 순 (누르면 펼쳐짐)</div>
    <div class="timeline">${c.visits.map(visitHtml).join('')}</div>`;
}
function visitHtml(v) {
  const draft = v.status === STATUS_DRAFT_TEXT;
  const crisis = crisisOf(v);
  const body = [v.memo, v.plan ? '▶ 계획: ' + v.plan : '', v.needs ? '· 욕구: ' + v.needs : ''].filter(Boolean).join('\n');
  return `<div class="tl-item${draft ? ' draft' : ''}" data-act="toggle">
    <div class="tl-head"><span class="d">${esc(v.date || '날짜 없음')}</span>
      ${v.type ? `<span class="badge muted">${esc(v.type)}</span>` : ''}${draft ? '<span class="badge muted">임시저장</span>' : ''}
      <span class="sub">${esc(v.author || '')}</span></div>
    ${crisis ? `<div class="tl-crisis">⚠ ${esc(crisis)}</div>` : ''}
    <div class="tl-body">${body ? esc(body) : '<span class="sub">적은 상담내용 없음</span>'}</div>
    ${/^https:\/\//.test(v.doc || '') ? `<div class="tl-more"><a href="${esc(v.doc)}" target="_blank" rel="noopener">방문기록지 열기 ↗</a></div>` : ''}
  </div>`;
}
/* 환자카드·방문예정에서 [방문기록 쓰기] → 방문기록 탭에 이름·생년월일을 채움 */
function startVisitFor(name, birth) {
  const cur = (state.patient || '').trim();
  const moved = cur && cur !== name;
  if (moved) { saveCurrent(true); resetForm(true); }
  state.patient = name;
  if (birth && (moved || !cur || !state.birth)) state.birth = birth;
  showTab('visit');
  paint(); saveDraft();
  onPatientPicked();
  if (moved) flash('okBanner', `쓰던 ${esc(cur)}님 기록은 [저장] 목록에 보관했습니다. ${$('okBanner').classList.contains('show') ? $('okBanner').innerHTML : ''}`);
}

/* ---------- 방문예정 ---------- */
function openTodos() {
  if (!todosLoaded || Date.now() - todosAt > STALE_MS) loadTodos();
  renderTodos();
}
function loadTodos() {
  return callServer('getTodos')
    .then(d => { todos = d.todos || []; todosLoaded = true; todosAt = Date.now(); renderTodos(); })
    .catch(err => { if (!$('todoMain').hidden) pageError('방문예정을 불러오지 못했습니다(' + errText(err) + '). [새로고침]을 눌러 주세요.'); });
}
function dueInfo(due) {
  if (!due) return { cls: '', text: '날짜 미정' };
  const diff = Math.round((Date.parse(due) - Date.parse(today())) / 86400000);
  const d = new Date(due + 'T00:00:00');
  const label = isNaN(d) ? due : `${d.getMonth() + 1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
  if (isNaN(diff)) return { cls: '', text: label };
  if (diff < 0) return { cls: 'late', text: `${label} · ${-diff}일 지남` };
  if (diff === 0) return { cls: 'today', text: `오늘 ${label}` };
  if (diff === 1) return { cls: '', text: `내일 ${label}` };
  return { cls: '', text: `${label} · ${diff}일 뒤` };
}
function todoHtml(t) {
  const di = dueInfo(t.due);
  const id = esc(t.id);
  return `<div class="todo${t.done ? ' done' : ''}${!t.done && di.cls === 'late' ? ' late' : ''}">
    <button type="button" class="tick" data-act="t-done" data-id="${id}" aria-label="${t.done ? '완료 취소' : '방문 완료로 표시'}">✓</button>
    <div class="main">
      <div class="top"><span class="nm">${esc(t.name)}</span> <span class="sub">${esc(t.birth || '')}</span></div>
      <div class="due ${t.done ? '' : di.cls}">${t.done ? '✓ 완료 ' + esc(String(t.doneAt || '').slice(0, 10)) : '📅 ' + esc(di.text)}</div>
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
      ${t.author ? `<div class="sub">${esc(t.author)} 작성</div>` : ''}
      <div class="acts">
        ${t.done ? '' : `<button type="button" class="btn small" data-act="t-write" data-id="${id}">📝 방문기록 쓰기</button>`}
        <button type="button" class="btn small" data-act="t-edit" data-id="${id}">수정</button>
        <button type="button" class="btn small" data-act="t-del" data-id="${id}">삭제</button>
      </div>
    </div>
  </div>`;
}
function renderTodos() {
  const open = todos.filter(t => !t.done)
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || String(a.created).localeCompare(String(b.created)));
  const done = todos.filter(t => t.done).sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 30);
  $('tHead').textContent = `방문할 분 ${open.length}명`;
  $('tList').innerHTML = open.length ? open.map(todoHtml).join('')
    : `<div class="empty">${todosLoaded ? '방문할 분이 없습니다. 위 칸에 적어 두세요.' : '불러오는 중…'}</div>`;
  $('tDoneBox').hidden = !done.length;
  $('tDoneHead').textContent = `완료한 방문 ${done.length}건${done.length === 30 ? ' (최근 30건)' : ''}`;
  $('tDone').innerHTML = done.map(todoHtml).join('');
  const due = open.filter(t => t.due && t.due <= today()).length;
  $('todoCount').textContent = due ? String(due) : '';
  if (!$('cardsMain').hidden && cards) renderCards(); // 카드의 방문예정 표시도 함께 갱신
}
function upsertTodo(t) {
  todos = todos.filter(x => x.id !== t.id).concat(t);
  renderTodos();
}
function tFormFill(t) {
  $('t-name').value = t.name || '';
  $('t-birth').value = t.birth || '';
  $('t-due').value = t.due || '';
  $('t-author').value = t.author || LS.get(KEY_AUTHOR, '');
  $('t-note').value = t.note || '';
}
function tFormReset() {
  tEditId = '';
  tFormFill({});
  $('tFormTitle').textContent = '방문할 분 적기';
  $('tSave').textContent = '목록에 추가';
  $('tCancel').hidden = true;
}
function editTodo(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  showTab('todo');
  tEditId = id;
  tFormFill(t);
  $('tFormTitle').textContent = `${t.name}님 방문예정 수정`;
  $('tSave').textContent = '수정 저장';
  $('tCancel').hidden = false;
  $('t-note').focus();
}
async function tSubmit() {
  const name = $('t-name').value.trim();
  if (!name) { pageError('방문할 분 이름을 입력해 주세요.'); $('t-name').focus(); return; }
  const prev = todos.find(x => x.id === tEditId);
  const t = {
    id: tEditId || uid(), name: name, birth: $('t-birth').value.trim(), due: $('t-due').value,
    author: $('t-author').value.trim(), note: $('t-note').value.trim(), done: prev ? prev.done : false
  };
  if (t.author) LS.set(KEY_AUTHOR, t.author);
  const btn = $('tSave');
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const res = await callServer('saveTodo', t);
    upsertTodo(Object.assign({}, prev, t, res && res.todo));
    tFormReset();
    flash('tOk', `📅 ${esc(name)}님을 방문예정에 ${prev ? '수정' : '추가'}했습니다.${IS_GAS ? '' : ' (미리보기 — 이 휴대폰에만 저장)'}`);
  } catch (err) {
    pageError('저장하지 못했습니다(' + errText(err) + '). 적은 내용은 그대로 있으니 신호가 잡히면 다시 눌러 주세요.');
  } finally {
    btn.disabled = false;
    btn.textContent = tEditId ? '수정 저장' : '목록에 추가';
  }
}
async function setTodoDone(id, done) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const before = { done: t.done, doneAt: t.doneAt };
  t.done = done; t.doneAt = done ? nowText() : '';
  renderTodos();
  try {
    const res = await callServer('saveTodo', Object.assign({}, t));
    if (res && res.todo) upsertTodo(Object.assign({}, t, res.todo));
  } catch (err) {
    Object.assign(t, before);
    renderTodos();
    pageError('완료 표시를 저장하지 못했습니다(' + errText(err) + ').');
  }
}
async function removeTodo(id) {
  const t = todos.find(x => x.id === id);
  if (!t || !confirm(`${t.name}님 방문예정을 삭제할까요? (완료했다면 ✓를 눌러 주세요)`)) return;
  try {
    await callServer('deleteTodo', id);
    todos = todos.filter(x => x.id !== id);
    renderTodos();
  } catch (err) {
    pageError('삭제하지 못했습니다(' + errText(err) + ').');
  }
}
/* 방문기록을 보낸 뒤: 같은 분 방문예정이 있으면 완료 버튼을 보여 줌 */
function offerTodoDone(rec) {
  const open = openTodosFor(rec.meta.patient, rec.meta.birth);
  if (!open.length) return;
  $('okBanner').insertAdjacentHTML('beforeend', ` <button class="btn small" type="button" id="todoDoneOffer">📅 방문예정 ${open.length}건 완료로 표시</button>`);
  $('todoDoneOffer').addEventListener('click', async () => {
    for (const t of open) await setTodoDone(t.id, true);
    flash('okBanner', `📅 ${esc(rec.meta.patient)}님 방문예정을 완료로 표시했습니다.`);
  });
}

/* 환자카드·방문예정 탭의 버튼 */
function onListAction(e) {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, c = (cards || []).find(x => x.key === cardKey);
  const t = el.dataset.id && todos.find(x => x.id === el.dataset.id);
  if (act === 'card') { cardKey = el.dataset.key; renderCards(); window.scrollTo({ top: 0 }); }
  else if (act === 'back') { cardKey = ''; renderCards(); }
  else if (act === 'toggle') el.classList.toggle('open');
  else if (act === 'write' && c) startVisitFor(c.name, c.birth);
  else if (act === 'plan' && c) { showTab('todo'); tFormReset(); tFormFill({ name: c.name, birth: c.birth }); $('t-note').focus(); }
  else if (act === 't-done' && t) setTodoDone(t.id, !t.done);
  else if (act === 't-write' && t) startVisitFor(t.name.trim(), t.birth);
  else if (act === 't-edit' && t) editTodo(t.id);
  else if (act === 't-del' && t) removeTodo(t.id);
}
function initLists() {
  $('cardsMain').addEventListener('click', onListAction);
  $('todoMain').addEventListener('click', onListAction);
  $('pSearch').addEventListener('input', renderCardList);
  $('pRefresh').addEventListener('click', () => openCards(true));
  $('tRefresh').addEventListener('click', () => { loadTodos(); });
  $('tSave').addEventListener('click', tSubmit);
  $('tCancel').addEventListener('click', tFormReset);
  $('t-birth').addEventListener('input', e => { e.target.value = formatBirth(e.target.value); });
  $('t-name').addEventListener('change', () => {
    // 전에 방문한 분이면 생년월일을 채움 (같은 이름이 한 분일 때만)
    const births = patients.filter(p => sameName(p.name, $('t-name').value) && p.birth).map(p => p.birth)
      .filter((b, i, a) => a.indexOf(b) === i);
    if (births.length === 1 && !$('t-birth').value) $('t-birth').value = births[0];
  });
  $('tPhrases').innerHTML = TODO_PHRASES.map(p => `<button type="button" class="phrase" data-val="${esc(p)}">+ ${esc(p)}</button>`).join('');
  $('tPhrases').addEventListener('click', e => {
    const v = e.target.dataset && e.target.dataset.val;
    if (!v) return;
    const cur = $('t-note').value.trim();
    $('t-note').value = cur ? cur + ' ' + v : v;
  });
  tFormReset();
  loadTodos();
}

function init() {
  render();
  initConsent();
  initLists();
  state = Object.assign(freshState(), LS.get(KEY_DRAFT, {}));
  paint();
  if (hasValue(state.patient)) flash('okBanner', '작성 중이던 기록을 불러왔습니다.');
  if (!IS_GAS) $('demoBanner').classList.add('show');
  showQueue(); showSaved();
  tick(); setInterval(tick, 1000);

  $('sendBtn').addEventListener('click', () => {
    if (!validate()) return;
    $('summary').textContent = summaryText(buildRecord());
    $('confirmDlg').showModal();
  });
  $('confirmBtn').addEventListener('click', onConfirm);
  $('cancelBtn').addEventListener('click', () => $('confirmDlg').close());
  $('resetBtn').addEventListener('click', onNew);
  $('saveBtn').addEventListener('click', () => saveCurrent(false));
  $('savedOpenBtn').addEventListener('click', () => $('savedDlg').showModal());
  $('savedCloseBtn').addEventListener('click', () => $('savedDlg').close());
  $('savedList').addEventListener('click', onSavedClick);
  $('copyBtn').addEventListener('click', copySummary);
  $('retryBtn').addEventListener('click', flushQueue);
  window.addEventListener('online', flushQueue);

  if (IS_GAS) {
    callServer('getInitData').then(d => {
      patients = d.patients || [];
      const ver = '화면 ' + SCREEN_VERSION + ' · 서버 ' + (d.version || '옛날 버전');
      $('draftState').dataset.version = ver;
      $('draftState').textContent = '저장: 휴대폰+시트에 임시저장 · 전송: 방문기록지 만들기 · ' + ver;
      fillPatientList();
      flushQueue();
    }).catch(err => showError('드라이브 연결 확인 필요: ' + (err && err.message ? err.message : err)));
  }
}
try { init(); } catch (err) { setTimeout(function () { throw err; }); }
</script>
