<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>재가센터 간담회 현수막</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block" rel="stylesheet">
<style>
@page { size: 400mm 90mm; margin: 0; }
html,body{margin:0;padding:0;background:#fff}
.banner{width:4000px;height:900px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;
  background:linear-gradient(180deg,#ffffff 0%,#f3f8f6 100%);}
.bar-top{position:absolute;left:0;right:0;top:0;height:70px;background:#0f6b5c}
.bar-bottom{position:absolute;left:0;right:0;bottom:0;height:70px;background:#0f6b5c}
.bar-top::after,.bar-bottom::after{content:"";position:absolute;left:0;right:0;height:16px;background:#f2a93b}
.bar-top::after{bottom:-16px}.bar-bottom::after{top:-16px}
.content{position:absolute;inset:86px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.sub{font-size:120px;font-weight:700;color:#0f6b5c;letter-spacing:4px}
.title{font-size:250px;font-weight:900;color:#1d2b33;letter-spacing:6px;line-height:1}
.title b{color:#0f6b5c}
.date{font-size:118px;font-weight:700;color:#fff;background:#0f6b5c;padding:6px 70px;border-radius:80px;letter-spacing:3px}
.date span{color:#f7c26b}
</style></head>
<body><div class="banner">
  <div class="bar-top"></div><div class="bar-bottom"></div>
  <div class="content">
    <div class="sub">부천시민의원 재택의료센터</div>
    <div class="title"><b>재가센터</b> 간담회</div>
    <div class="date">2026. 11. 10.(화) <span>오후 5시</span></div>
  </div>
</div></body></html>
